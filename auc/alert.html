<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Донаты и события — виджет OBS</title>
<!-- OBS: источник «Браузер», 800×300. Настройки внешнего вида — на renah0cki.xyz/donate-settings/ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Montserrat:wght@600;700;800;900&family=Russo+One&family=Spectral:wght@600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<style>
  :root {
    --al-accent: #8b5cf6;
    --al-text: #f3f4fa;
    --al-bg: rgba(14, 14, 24, .82);
    --al-border: rgba(139, 92, 246, .48);
    --al-glow: rgba(139, 92, 246, .32);
    --al-glow-hi: rgba(139, 92, 246, .68);
    --al-font: "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --al-hsz: 34px;
    --al-msz: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  [hidden] { display: none !important; }
  body { font-family: var(--al-font); color: var(--al-text); display: grid; place-items: center; min-height: 100vh; padding: 18px; }

  .al {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; max-width: min(760px, 94vw);
    padding: 20px 28px; border-radius: 22px;
    background: var(--al-bg);
    border: 1px solid var(--al-border);
    box-shadow: 0 18px 46px rgba(0, 0, 0, .55), 0 0 34px var(--al-glow), inset 0 1px 0 rgba(255, 255, 255, .12);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    opacity: 0; pointer-events: none;
    will-change: transform, opacity;
  }

  .al[data-layout="left"] { flex-direction: row; text-align: left; gap: 20px; padding: 18px 26px; }
  .al[data-layout="left"] .al-body { align-items: flex-start; }
  .al[data-layout="none"] .al-img-wrap { display: none; }

  .al-img-wrap { flex: none; display: grid; place-items: center; }
  .coin { width: 88px; height: 88px; object-fit: contain; border-radius: 14px;
    filter: drop-shadow(0 8px 20px var(--al-glow-hi));
    animation: bob 1.9s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }

  .al-body { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .head { font-size: var(--al-hsz); font-weight: 900; line-height: 1.15; letter-spacing: -.01em;
    text-shadow: 0 3px 12px rgba(0, 0, 0, .7); overflow-wrap: anywhere; }
  .head b { color: var(--al-accent); text-shadow: 0 0 22px var(--al-glow-hi), 0 3px 10px rgba(0, 0, 0, .75); }
  .msg { font-size: var(--al-msz); font-weight: 600; line-height: 1.4; color: var(--al-text); opacity: .94;
    max-width: 680px; overflow-wrap: anywhere; text-shadow: 0 2px 8px rgba(0, 0, 0, .65); }

  /* ── темы (без color-mix — 100% совместимость со всеми версиями OBS) ── */
  .al[data-theme="neon"] {
    border: 2px solid var(--al-accent);
    box-shadow: 0 0 22px var(--al-glow-hi), 0 0 56px var(--al-glow), inset 0 0 22px var(--al-glow);
  }
  .al[data-theme="minimal"] {
    border-radius: 14px; padding: 14px 22px;
    border: 1px solid rgba(255, 255, 255, .14);
    border-left: 4px solid var(--al-accent);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .48);
  }
  .al[data-theme="slay"] {
    border-radius: 16px;
    border: 1.5px solid var(--al-accent);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .75), 0 0 36px var(--al-glow-hi), inset 0 1px 0 rgba(255, 224, 160, .3);
  }
  .al[data-theme="clean"] {
    background: transparent !important; border: 0 !important; box-shadow: none !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important; padding: 8px 12px;
  }
  .al[data-theme="clean"] .msg {
    padding: 8px 16px; border-radius: 12px; background: var(--al-bg);
  }

  /* ── анимации появления ── */
  .al[data-anim="pop"]    { transform: translateY(18px) scale(.92); transition: opacity .36s ease, transform .46s cubic-bezier(.2, .85, .25, 1.18); }
  .al[data-anim="slide"]  { transform: translateY(44px); transition: opacity .34s ease, transform .45s cubic-bezier(.22, 1, .36, 1); }
  .al[data-anim="zoom"]   { transform: scale(.72); transition: opacity .32s ease, transform .42s cubic-bezier(.22, 1, .36, 1); }
  .al[data-anim="bounce"] { transform: translateY(-32px) scale(.94); transition: opacity .3s ease, transform .55s cubic-bezier(.34, 1.56, .64, 1); }
  .al.show { opacity: 1; transform: none; }
  .al.instant { transition: none !important; opacity: 0 !important; }
</style>
</head>
<body>
<div class="al" id="al" data-theme="glass" data-anim="pop" data-layout="top" aria-live="polite">
  <div class="al-img-wrap"><img class="coin" id="img" src="https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png" alt=""></div>
  <div class="al-body">
    <div class="head" id="h"></div>
    <div class="msg" id="m" hidden></div>
  </div>
</div>
<script>
(() => {
  const DEFAULT_IMG = 'https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png';
  const FONTS = {
    Inter: '"Inter", system-ui, sans-serif',
    Montserrat: '"Montserrat", system-ui, sans-serif',
    Unbounded: '"Unbounded", system-ui, sans-serif',
    'Russo One': '"Russo One", system-ui, sans-serif',
    Spectral: '"Spectral", Georgia, serif',
  };
  const QS = new URLSearchParams(location.search);
  const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = (LOCAL && QS.get('api')) || 'https://cdn.renah0cki.xyz';
  const fmt = n => (+n || 0).toLocaleString('ru-RU');

  const DA_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffb347"/><stop offset="55%" stop-color="#ff7a18"/><stop offset="100%" stop-color="#e3380c"/></linearGradient></defs><rect width="96" height="96" rx="24" fill="url(#g)"/><path d="M48 73s-22-13.2-22-29.2C26 35 32.5 29 40 29c4.5 0 8 2.4 8 2.4S51.5 29 56 29c7.5 0 14 6 14 14.8C70 59.8 48 73 48 73z" fill="#fff"/></svg>');
  let cfg = {
    duration: 8, min: 1, show_message: true, sound: true, sound_preset: 'chime', volume: 75,
    tts: true, tts_voice: 'female', tts_viewer_pick: true, tts_read_header: true, tts_volume: 85,
    theme: 'glass', anim: 'pop', layout: 'top',
    accent: '#8b5cf6', text_color: '#f3f4fa', bg_color: '#0e0e18', bg_alpha: 82,
    font: 'Inter', head_size: 34, msg_size: 20, image_url: '', da_image_url: ''
  };

  function hexToRgba(hex, a) {
    const m = String(hex || '').replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    if (!m) return `rgba(139, 92, 246, ${a})`;
    return `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, ${a})`;
  }

  function applyStyle(kind = 'coin') {
    const r = document.documentElement.style;
    const al = document.getElementById('al');
    const acc = kind === 'da' ? '#ff8a24' : (/^#[0-9a-f]{6}$/i.test(cfg.accent || '') ? cfg.accent : '#8b5cf6');
    al.dataset.theme = ['glass', 'neon', 'minimal', 'slay', 'clean'].includes(cfg.theme) ? cfg.theme : 'glass';
    al.dataset.anim = ['pop', 'slide', 'zoom', 'bounce'].includes(cfg.anim) ? cfg.anim : 'pop';
    al.dataset.layout = ['top', 'left', 'none'].includes(cfg.layout) ? cfg.layout : 'top';
    r.setProperty('--al-accent', acc);
    r.setProperty('--al-border', hexToRgba(acc, 0.48));
    r.setProperty('--al-glow', hexToRgba(acc, 0.30));
    r.setProperty('--al-glow-hi', hexToRgba(acc, 0.65));
    r.setProperty('--al-text', /^#[0-9a-f]{6}$/i.test(cfg.text_color || '') ? cfg.text_color : '#f3f4fa');
    const alpha = Math.max(0, Math.min(100, Number(cfg.bg_alpha ?? 82))) / 100;
    r.setProperty('--al-bg', hexToRgba(cfg.bg_color || '#0e0e18', alpha));
    r.setProperty('--al-font', FONTS[cfg.font] || FONTS.Inter);
    r.setProperty('--al-hsz', Math.max(18, Math.min(60, Number(cfg.head_size) || 34)) + 'px');
    r.setProperty('--al-msz', Math.max(12, Math.min(40, Number(cfg.msg_size) || 20)) + 'px');
    const img = document.getElementById('img');
    const src = kind === 'da'
      ? (/^https:\/\//i.test(cfg.da_image_url || '') ? cfg.da_image_url : DA_SVG)
      : (/^https:\/\//i.test(cfg.image_url || '') ? cfg.image_url : DEFAULT_IMG);
    if (img.src !== src) img.src = src;
  }

  let ac = null, chimeGain = null;
  function playSound() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime;
      const vol = Math.max(0, Math.min(1, (Number(cfg.volume ?? 75)) / 100)) * 0.45;
      if (vol <= 0.001) return;
      const master = ac.createGain();
      master.gain.value = 1;
      master.connect(ac.destination);
      chimeGain = master;
      const preset = cfg.sound_preset || 'chime';
      const seq = preset === 'coin'
        ? [[987.77, 0, .09, 'triangle'], [1318.5, .08, .35, 'triangle']]
        : preset === 'crystal'
          ? [[1046.5, 0, .45, 'sine'], [1567.98, .07, .5, 'sine'], [2093, .14, .65, 'sine']]
          : preset === 'soft'
            ? [[523.25, 0, .55, 'sine'], [659.25, .06, .55, 'sine'], [783.99, .12, .6, 'sine']]
            : [[880, 0, .5, 'sine'], [1318.5, .09, .55, 'sine'], [1760, .18, .6, 'sine']];
      seq.forEach(([freq, delay, dur, type]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0, t + delay);
        g.gain.linearRampToValueAtTime(vol, t + delay + .02);
        g.gain.exponentialRampToValueAtTime(0.0008, t + delay + dur);
        o.connect(g).connect(master);
        o.start(t + delay); o.stop(t + delay + dur + .05);
      });
    } catch {}
  }

  function pluralRu(n, a, b, c) {
    n = Math.abs(Math.floor(Number(n) || 0)) % 100;
    const k = n % 10;
    return n > 10 && n < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c;
  }
  function unitWord(n, unit) {
    const u = String(unit || 'coin').toUpperCase();
    if (u === 'RUB' || u === 'RUR' || u === '₽') return pluralRu(n, 'рубль', 'рубля', 'рублей');
    if (u === 'USD' || u === '$') return pluralRu(n, 'доллар', 'доллара', 'долларов');
    if (u === 'EUR' || u === '€') return 'евро';
    if (u === 'UAH' || u === '₴') return pluralRu(n, 'гривна', 'гривны', 'гривен');
    if (u === 'KZT' || u === '₸') return 'тенге';
    if (u === 'BYN') return pluralRu(n, 'белорусский рубль', 'белорусских рубля', 'белорусских рублей');
    return pluralRu(n, 'коин', 'коина', 'коинов');
  }
  let curAudio = null;
  let skipCur = null;
  function stopCurrentAudio() {
    try { if (chimeGain) { chimeGain.gain.setValueAtTime(0, ac.currentTime); chimeGain = null; } } catch {}
    try { if (curAudio) { curAudio.pause(); curAudio.currentTime = 0; curAudio = null; } } catch {}
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch {}
  }
  function skipCurrent() {
    stopCurrentAudio();
    const al = document.getElementById('al');
    al.classList.add('instant');
    al.classList.remove('show');
    if (skipCur) { const fn = skipCur; skipCur = null; fn(); }
  }
  function speakFallback(text, voice, vol) {
    return new Promise(resolve => {
      try {
        if (!('speechSynthesis' in window) || vol <= 0.001) return resolve();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ru-RU';
        u.volume = vol;
        u.rate = 1.02;
        u.pitch = voice === 'male' ? 0.82 : 1.08;
        const voices = speechSynthesis.getVoices().filter(v => /^ru/i.test(v.lang));
        const pick = voice === 'male'
          ? voices.find(v => /dmitry|pavel|yuri|maxim|male/i.test(v.name)) || voices[0]
          : voices.find(v => /svetlana|irina|tatyana|milena|elena|female/i.test(v.name)) || voices[0];
        if (pick) u.voice = pick;
        const cap = setTimeout(resolve, 25000);
        u.onend = u.onerror = () => { clearTimeout(cap); resolve(); };
        speechSynthesis.speak(u);
      } catch { resolve(); }
    });
  }
  async function speakTts(d, aborted) {
    if (cfg.tts === false || aborted()) return;
    const vol = Math.max(0, Math.min(1, (Number(cfg.tts_volume ?? 85)) / 100));
    if (vol <= 0.001) return;
    const voice = (cfg.tts_viewer_pick !== false && (d.voice === 'female' || d.voice === 'male'))
      ? d.voice : (cfg.tts_voice === 'male' ? 'male' : 'female');
    const parts = [];
    if (cfg.tts_read_header !== false) {
      parts.push(`${d.user || d.name || 'Аноним'}, ${Math.round(Number(d.amount) || 0)} ${unitWord(d.amount, d.unit || (d.type === 'da' ? 'RUB' : 'coin'))}.`);
    }
    if (cfg.show_message !== false && d.message) parts.push(String(d.message).trim());
    const text = parts.join(' ').trim().slice(0, 350);
    if (!text) return;

    const url = `${API}/auc/tts?voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(text)}`;
    try {
      const r = await fetch(url);
      if (!r.ok || aborted()) throw new Error('tts ' + r.status);
      const blob = await r.blob();
      if (aborted()) return;
      const objUrl = URL.createObjectURL(blob);
      await new Promise(resolve => {
        const audio = new Audio(objUrl);
        curAudio = audio;
        audio.volume = vol;
        const done = () => { clearTimeout(cap); if (curAudio === audio) curAudio = null; URL.revokeObjectURL(objUrl); resolve(); };
        const cap = setTimeout(done, 42000);
        audio.onended = audio.onerror = audio.onpause = done;
        audio.play().catch(done);
      });
    } catch {
      if (!aborted()) await speakFallback(text, voice, vol);
    }
  }

  const queue = []; let busy = false; let paused = false; const seen = new Set();
  function formatHead(d) {
    const h = document.getElementById('h');
    h.innerHTML = '';
    const name = d.user || d.name || 'Аноним';
    const b = document.createElement('b');
    if (d.type === 'tw_follow') {
      h.append(document.createTextNode(name + ' — '));
      b.textContent = 'новый фолловер!';
      h.append(b);
    } else if (d.type === 'tw_sub') {
      h.append(document.createTextNode(name + ' — '));
      b.textContent = d.title || 'подписался!';
      h.append(b);
    } else if (d.type === 'tw_gift') {
      h.append(document.createTextNode(name + ' — '));
      b.textContent = d.title || `подарил ${fmt(d.amount)} саб.!`;
      h.append(b);
    } else if (d.type === 'tw_points') {
      h.append(document.createTextNode(name + ' · '));
      b.textContent = (d.title || 'Награда') + (d.amount ? ` (${fmt(d.amount)})` : '');
      h.append(b);
    } else if (d.type === 'da') {
      h.append(document.createTextNode(name + ' — '));
      b.textContent = `${fmt(d.amount)} ${d.unit || 'RUB'}`;
      h.append(b);
    } else {
      h.append(document.createTextNode(name + ' — '));
      b.textContent = `${fmt(d.amount)} ${d.unit || 'coin'}`;
      h.append(b);
    }
  }
  function enqueue(d) {
    const key = d.replayId || d.id;
    if (!key || seen.has(key)) return;
    seen.add(key);
    if (seen.size > 500) seen.delete(seen.values().next().value);
    if (d.force) queue.unshift(d);
    else queue.push(d);
    next();
  }
  async function next() {
    if (busy || !queue.length) return;
    if (paused && !queue[0].force) return;
    busy = true;
    const d = queue.shift();
    applyStyle(d.type === 'da' ? 'da' : 'coin');
    formatHead(d);
    const m = document.getElementById('m');
    m.hidden = !(cfg.show_message !== false && d.message);
    m.textContent = d.message || '';
    const hasSound = cfg.sound !== false;
    if (hasSound) playSound();
    const al = document.getElementById('al');
    al.classList.remove('instant');
    void al.offsetWidth;
    al.classList.add('show');
    let skipped = false;
    const skipP = new Promise(r => { skipCur = () => { skipped = true; r(); }; });
    let minT;
    const minWait = new Promise(r => { minT = setTimeout(r, Math.max(3, Math.min(60, +cfg.duration || 8)) * 1000); });
    const ttsWait = (async () => {
      if (cfg.tts === false || skipped) return;
      if (hasSound) await Promise.race([new Promise(r => setTimeout(r, 620)), skipP]);
      if (!skipped) await speakTts(d, () => skipped);
    })();
    await Promise.race([Promise.all([minWait, ttsWait]), skipP]);
    clearTimeout(minT);
    skipCur = null;
    stopCurrentAudio();
    al.classList.remove('show');
    const doneId = d.feedId || d.id;
    if (doneId) fetch(API + '/auc/feed/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: doneId }) }).catch(() => {});
    setTimeout(() => { busy = false; next(); }, 450);
  }

  applyStyle();
  fetch(API + '/auc/state').then(r => r.json()).then(s => { if (s?.config?.alert) { cfg = { ...cfg, ...s.config.alert }; applyStyle(); } }).catch(() => {});
  const es = new EventSource(API + '/auc/events');
  es.onmessage = e => {
    try {
      const s = JSON.parse(e.data);
      if (s?.config?.alert) { cfg = { ...cfg, ...s.config.alert }; applyStyle(); }
    } catch {}
  };
  es.addEventListener('feed_cfg', e => {
    try {
      const c = JSON.parse(e.data);
      if (typeof c?.paused === 'boolean') { paused = c.paused; if (!paused) next(); }
    } catch {}
  });
  es.addEventListener('alert_skip', () => skipCurrent());
  es.addEventListener('donation', e => {
    try {
      const d = JSON.parse(e.data);
      const t = d.type === 'da' ? 'da' : 'coin';
      if (d.type && d.type !== 'coin' && d.type !== 'da') return;
      if (!d.test && !d.force && t === 'coin' && +d.amount < (+cfg.min || 1)) return;
      enqueue({ ...d, type: t, unit: d.unit || (t === 'da' ? 'RUB' : 'coin') });
    } catch {}
  });
})();
</script>
</body>
</html>
