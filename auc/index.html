<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<title>Аукцион — renah0cki</title>
<script>/* аукцион — пока только для владельца; остальных на обычный сайт */
(function(){if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return;try{var s=JSON.parse(localStorage.getItem('fh_session')||'null');if(!s||!s.user||s.user.id!=='23c6cb47-27b0-45ac-8fd9-c43b84d57aba')location.replace('/');}catch(e){location.replace('/');}})();</script>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=2">
<link rel="preconnect" href="https://api.renah0cki.xyz" crossorigin>
<link rel="preconnect" href="https://cdn.renah0cki.xyz" crossorigin>
<link rel="stylesheet" href="/auc/auc.css?v=20261120a">
<script src="/auc/auc.js?v=20261120a" defer></script>
</head>
<body>
<header class="top">
  <a class="logo" href="/" aria-label="renah0cki — на главную">
    <img src="https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png" alt="" width="30" height="30">
    <span>rena<b>h0cki</b></span>
  </a>
  <span class="top-sep" aria-hidden="true">/</span>
  <span class="top-title">Аукцион</span>
  <div class="top-right">
    <span class="bal" id="bal" hidden title="Баланс coin"><img src="https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png" alt="" width="18" height="18"><b id="balN">0</b></span>
    <span class="live" id="live" title="Связь с сервером"><i></i><span>связь</span></span>
  </div>
</header>

<main class="wrap">
  <section class="hero card" id="hero" aria-live="polite">
    <div class="hero-row">
      <div class="hero-main">
        <h1 id="aTitle">Аукцион</h1>
        <div class="hero-meta"><span class="chip" id="aStatus">—</span><span id="aTotal" class="muted"></span></div>
      </div>
      <div class="timer" id="timer" aria-label="Оставшееся время">--:--</div>
    </div>
    <div class="ctl" id="ctl" hidden></div>
  </section>

  <nav class="tabs" id="tabs" hidden aria-label="Разделы панели">
    <button data-tab="lots" class="on">Лоты</button>
    <button data-tab="queue">Очередь <b class="badge" id="qBadge" hidden>0</b></button>
    <button data-tab="bids">Ставки</button>
    <button data-tab="wallets">Кошельки</button>
    <button data-tab="history">История</button>
    <button data-tab="settings">Настройки</button>
  </nav>

  <div class="cols">
    <section class="col-main" id="view"></section>
    <aside class="col-side">
      <section class="card" id="bidBox"></section>
      <section class="card">
        <h2 class="h2">Последние ставки</h2>
        <ol class="feed" id="feed"></ol>
      </section>
      <section class="card" id="myBox" hidden>
        <h2 class="h2">Мои ставки</h2>
        <ol class="feed" id="myBids"></ol>
      </section>
    </aside>
  </div>
</main>

<button class="fab" id="fab" hidden>Поставить coin</button>

<dialog class="sheet" id="sheet">
  <form method="dialog" class="sheet-in" id="sheetForm">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" value="cancel" aria-label="Закрыть" formnovalidate>✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
</body>
</html>
