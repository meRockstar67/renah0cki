<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Аукцион — оверлей</title>
<!-- OBS: источник «Браузер», 600×800. Параметры: ?top=8 (сколько лотов), ?scale=1.2 (размер), ?bg=1 (тёмная подложка) -->
<style>
  :root { --text: #eaf2ff; --muted: #a9bad4; --accent: #6cc4ff; --ok: #5fd3a0; --danger: #ff6b7d; --panel: rgba(11, 18, 32, .78); }
  html, body { margin: 0; background: transparent; color: var(--text); overflow: hidden; }
  body { font: 700 20px/1.3 system-ui, "Segoe UI", Roboto, sans-serif; padding: 12px; zoom: var(--z, 1); text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
  body.bg .box { background: var(--panel); border-radius: 18px; padding: 16px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .title { font-size: 24px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer { font-size: 46px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--danger); }
  .timer.off { color: var(--muted); font-size: 30px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { position: relative; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; overflow: hidden; isolation: isolate;
    background: rgba(11, 18, 32, .72); transition: transform .4s; }
  li .bar { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(108, 196, 255, .45), rgba(108, 196, 255, .12)); z-index: -1; transition: width .6s cubic-bezier(.2, .7, .2, 1); }
  li.win .bar { background: linear-gradient(90deg, rgba(95, 211, 160, .55), rgba(95, 211, 160, .15)); }
  .rk { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(255, 255, 255, .12); font-size: 16px; }
  li:first-child .rk { background: var(--accent); color: #06121f; text-shadow: none; }
  .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm small { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .pt { font-variant-numeric: tabular-nums; font-weight: 900; }
  .pt small { color: var(--muted); font-weight: 700; font-size: 15px; margin-left: 6px; }
  .last { margin-top: 10px; font-size: 16px; color: var(--muted); min-height: 22px; }
  .last b { color: var(--text); }
  .wheel { display: none; }
  body.spin #l, body.spin .last { display: none; }
  body.spin .wheel { display: grid; justify-items: center; gap: 10px; }
  .wb { position: relative; width: min(560px, 92vw); aspect-ratio: 1; }
  .wb canvas { width: 100%; height: 100%; display: block; }
  .wb-img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 20%; height: 20%; min-width: 52px; min-height: 52px; border-radius: 50%; object-fit: cover; pointer-events: none; z-index: 1; background: #0c0c14; border: 3px solid rgba(255,240,230,.9); }
  .ptr { position: absolute; z-index: 2; left: 50%; top: -6px; width: 40px; height: 46px; transform: translateX(-50%); fill: #f8f4ff; stroke: #0c0c14; stroke-width: 2.5; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .wres { font-size: 26px; font-weight: 900; text-align: center; min-height: 34px; }
  .wres.win { color: var(--ok); }
</style>
</head>
<body>
<div class="box">
  <div class="head"><div class="title" id="t">Аукцион</div><div class="timer off" id="tm">—</div></div>
  <ol id="l"></ol>
  <div class="last" id="last"></div>
  <div class="wheel"><div class="wb"><svg class="ptr" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 44 4 14A16 16 0 1 1 36 14z"/></svg><canvas id="wc"></canvas><img class="wb-img" id="wci" alt=""></div><div class="wres" id="wr"></div></div>
</div>
<script src="wheel.js?v=20261121s"></script>
<script>
(() => {
  const QS = new URLSearchParams(location.search);
  const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const API = (LOCAL && QS.get('api')) || 'https://cdn.renah0cki.xyz';
  const TOP = Math.max(1, Math.min(20, +QS.get('top') || 8));
  document.body.style.setProperty('--z', +QS.get('scale') || 1);
  if (QS.get('bg') === '1') document.body.classList.add('bg');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('ru-RU');
  const SRC = { da: 'DA', donatello: 'Donatello', donatepay: 'DonatePay', donatex: 'DonateX', twitch: 'Twitch', site: 'coin', wallet: 'кошелёк', manual: '' };
  let D = null, off = 0;
  function draw() {
    if (!D) return;
    const a = D.auction, lots = D.lots.slice(0, TOP);
    const max = Math.max(1, ...lots.map(l => +l.total)), sum = D.lots.reduce((s, l) => s + +l.total, 0) || 1;
    document.getElementById('t').textContent = a.title;
    document.getElementById('l').innerHTML = lots.map((l, i) => `<li class="${a.winner_lot === l.id ? 'win' : ''}"><span class="bar" style="width:${(+l.total / max * 100).toFixed(1)}%"></span>
      <span class="rk">${i + 1}</span><span class="nm"><small>#${l.num}</small>${esc(l.name)}</span><span class="pt">${fmt(l.total)}<small>${(+l.total / sum * 100).toFixed(0)}%</small></span></li>`).join('');
    const b = D.recent?.[0];
    document.getElementById('last').innerHTML = b ? `Последняя: <b>${esc(b.user_name)}</b> +${fmt(b.points)} ${SRC[b.source] ? '· ' + SRC[b.source] : ''}` : '';
  }
  function tick() {
    if (!D) return;
    const a = D.auction, el = document.getElementById('tm');
    let ms = a.status === 'running' && a.ends_at ? Date.parse(a.ends_at) - (Date.now() + off) : a.status === 'paused' ? a.left_ms : null;
    if (ms == null) { el.textContent = { idle: 'скоро', ended: 'ставки закрыты', closed: 'итоги' }[a.status] || ''; el.className = 'timer off'; return; }
    const s = Math.ceil(Math.max(0, ms) / 1000), m = Math.floor(s / 60);
    el.textContent = String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    el.className = 'timer' + (a.status === 'running' && s <= 30 ? ' low' : '');
  }
  const es = new EventSource(API + '/auc/events');
  es.onmessage = e => { try { D = JSON.parse(e.data); off = Date.parse(D.now) - Date.now(); draw(); tick(); } catch {} };
  setInterval(tick, 250);
  // колесо: показывается, когда стример его крутит, и прячется через 12 с после остановки
  let lastSpin = null, hideT = null, stopSpin = null, img = null;
  const LOGO = 'https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png';
  es.addEventListener('spin', e => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (!window.AucWheel || lastSpin === ev.id) return; lastSpin = ev.id;
    const W = window.AucWheel, c = { palette: 'rainbow', labels: 'radial', sound: 'ticks', volume: 0.5, ...(D?.config?.wheel || {}) };
    const segs = W.segs(ev.lots, c.palette), cv = document.getElementById('wc'), res = document.getElementById('wr'), wci = document.getElementById('wci');
    if (wci && wci.src !== (c.image || LOGO)) wci.src = c.image || LOGO;
    const o = { labels: c.labels, hideSum: c.hide_sum, fullText: c.full_text, htmlImg: true, accel: c.accel };
    clearTimeout(hideT); stopSpin?.();
    document.body.classList.add('spin'); res.className = 'wres';
    let last = null, lastT = 0;
    stopSpin = W.spin(cv, segs, ev.from, ev.to, ev.ms, ev.startAt - off, o, s => {
      if (!s || s.id === last) return; last = s.id; res.textContent = s.name;
      const now = performance.now(); if (c.sound === 'ticks' && now - lastT > 35) { lastT = now; W.tick(+c.volume); }
    }, rot => {
      const win = segs.find(s => s.id === ev.winner) || W.at(segs, rot);
      W.draw(cv, segs, rot, { ...o, hi: win?.id });
      res.textContent = win ? (ev.mode === 'elim' ? 'Выбыл: ' : 'Победитель: ') + win.name : ''; res.className = 'wres' + (ev.mode === 'elim' ? '' : ' win');
      hideT = setTimeout(() => document.body.classList.remove('spin'), 12000);
    });
  });
})();
</script>
</body>
</html>
