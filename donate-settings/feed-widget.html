<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Последние события — виджет OBS</title>
<!-- OBS: источник «Браузер», 440×520 (список) или 1200×90 (бегущая строка). Настройки: renah0cki.xyz/donate-settings/feed.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Montserrat:wght@600;700;800&family=Russo+One&family=Spectral:wght@600;700&family=Unbounded:wght@600;700&display=swap">
<style>
  :root {
    --w-accent: #8b5cf6;
    --w-accent-bg: rgba(139, 92, 246, .18);
    --w-accent-bd: rgba(139, 92, 246, .42);
    --w-text: #f3f4fa;
    --w-bg: rgba(13, 13, 23, .82);
    --w-font: "Inter", system-ui, sans-serif;
    --w-fs: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--w-font); font-size: var(--w-fs); color: var(--w-text); padding: 10px; }
  [hidden] { display: none !important; }

  .root { transition: opacity .4s ease, transform .4s ease; }
  .root.paused { opacity: 0; transform: translateY(-8px); pointer-events: none; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .ev {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 6px 11px; align-items: start;
    padding: 11px 14px; border-radius: 15px;
    background: var(--w-bg);
    border: 1px solid var(--bd, var(--w-accent-bd));
    box-shadow: 0 10px 26px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: evIn .42s cubic-bezier(.22, 1, .36, 1) both;
  }
  .ev::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3.5px; border-radius: 0 4px 4px 0;
    background: var(--c, var(--w-accent)); box-shadow: 0 0 12px var(--c, var(--w-accent)); }
  .ev.no-ico { grid-template-columns: 1fr; }
  .ev.flash { animation: evFlash .9s ease; }
  @keyframes evIn { from { opacity: 0; transform: translateX(-14px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes evFlash { 0%, 100% { filter: none; } 35% { filter: brightness(1.35) drop-shadow(0 0 18px var(--c, var(--w-accent))); } }

  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; flex: none;
    background: var(--ib, var(--w-accent-bg));
    border: 1px solid var(--bd, var(--w-accent-bd)); }
  .ico img { width: 22px; height: 22px; object-fit: contain; }
  .body { min-width: 0; display: grid; gap: 3px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .who { font-weight: 800; color: var(--w-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 800; color: var(--c, var(--w-accent)); white-space: nowrap; }
  .sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .84em; opacity: .76; }
  .msg { font-size: .92em; line-height: 1.38; opacity: .92; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* цвета по типам (без color-mix — работает во всех версиях OBS) */
  .ev[data-t="coin"]      { --c: #5cc8ff; --ib: rgba(92, 200, 255, .18); --bd: rgba(92, 200, 255, .44); }
  .ev[data-t="da"]        { --c: #ff8a24; --ib: rgba(255, 138, 36, .18); --bd: rgba(255, 138, 36, .42); }
  .ev[data-t="tw_follow"],
  .ev[data-t="tw_sub"],
  .ev[data-t="tw_gift"],
  .ev[data-t="tw_points"] { --c: #9146ff; --ib: rgba(145, 70, 255, .20); --bd: rgba(145, 70, 255, .48); }
  .ev[data-t^="tw_"] .amt { color: #b983ff; }

  .root[data-theme="neon"] .ev {
    border: 1.5px solid var(--c, var(--w-accent));
    box-shadow: 0 0 18px var(--bd, var(--w-accent-bd)), inset 0 0 14px var(--ib, var(--w-accent-bg)); }
  .root[data-theme="minimal"] .ev { border-radius: 10px; border-color: rgba(255, 255, 255, .12); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
  .root[data-theme="slay"] .ev {
    border-radius: 12px; border-color: rgba(255, 123, 28, .65);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .65), 0 0 22px rgba(255, 92, 16, .28); }
  .root[data-theme="clean"] .ev { background: transparent !important; border: 0 !important; box-shadow: none !important; backdrop-filter: none !important; padding: 6px 8px; }
  .root[data-theme="clean"] .ev::before { display: none; }
  .root[data-theme="clean"] .who, .root[data-theme="clean"] .msg { text-shadow: 0 2px 8px rgba(0, 0, 0, .92); }

  .root[data-mode="ticker"] .list { flex-direction: row; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; }
  .root[data-mode="ticker"] .ev { flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; border-radius: 999px; }
  .root[data-mode="ticker"] .ev::before { display: none; }
  .root[data-mode="ticker"] .ico { width: 26px; height: 26px; font-size: 14px; border-radius: 50%; }
  .root[data-mode="ticker"] .ico img { width: 16px; height: 16px; }
  .root[data-mode="ticker"] .body { display: inline-flex; align-items: center; gap: 8px; }
  .root[data-mode="ticker"] .sub, .root[data-mode="ticker"] .msg { display: none; }
  .root[data-mode="single"] .ev { padding: 14px 18px; }
</style>
</head>
<body>
<div class="root" id="root" data-theme="glass" data-mode="list">
  <div class="list" id="list"></div>
</div>
<script>
(() => {
  const API = 'https://cdn.renah0cki.xyz';
  const COIN_IMG = 'https://cdn.renah0cki.xyz/file/static/Resurs-134x-8.png';
  const FONTS = {
    Inter: '"Inter", system-ui, sans-serif',
    Montserrat: '"Montserrat", system-ui, sans-serif',
    Unbounded: '"Unbounded", system-ui, sans-serif',
    'Russo One': '"Russo One", system-ui, sans-serif',
    Spectral: '"Spectral", Georgia, serif',
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('ru-RU');
  let events = [];
  let cfg = {
    paused: false, enabled: { coin: true, da: true, tw_follow: true, tw_sub: true, tw_gift: true, tw_points: true },
    min_coin: 1, min_da: 1, min_points: 0, limit: 6, mode: 'list', theme: 'glass',
    accent: '#8b5cf6', text_color: '#f3f4fa', bg_color: '#0d0d17', bg_alpha: 82,
    font: 'Inter', font_size: 14, show_message: true, show_time: true, show_icon: true,
  };

  function hexToRgba(hex, a) {
    const m = String(hex || '').replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    if (!m) return `rgba(139, 92, 246, ${a})`;
    return `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, ${a})`;
  }
  function passes(ev) {
    if (ev.hidden) return false;
    if (cfg.enabled && cfg.enabled[ev.type] === false) return false;
    if (ev.type === 'coin' && Number(ev.amount || 0) < (Number(cfg.min_coin) || 0)) return false;
    if (ev.type === 'da' && Number(ev.amount || 0) < (Number(cfg.min_da) || 0)) return false;
    if (ev.type === 'tw_points' && Number(ev.amount || 0) < (Number(cfg.min_points) || 0)) return false;
    return true;
  }
  function iconHtml(ev) {
    if (ev.type === 'coin') return `<img src="${COIN_IMG}" alt="">`;
    if (ev.type === 'da') return '🧡';
    if (ev.type === 'tw_follow') return '💜';
    if (ev.type === 'tw_sub') return '⭐';
    if (ev.type === 'tw_gift') return '🎁';
    if (ev.type === 'tw_points') return '💎';
    return '✨';
  }
  function rightLabel(ev) {
    if (ev.type === 'coin') return `${fmt(ev.amount)} coin`;
    if (ev.type === 'da') return `${fmt(ev.amount)} ${ev.unit || 'RUB'}`;
    if (ev.type === 'tw_follow') return 'Фолловер';
    if (ev.type === 'tw_sub') return ev.amount > 1 ? `Саб · ${ev.amount} мес.` : 'Подписка';
    if (ev.type === 'tw_gift') return `+${fmt(ev.amount)} саб.`;
    if (ev.type === 'tw_points') return ev.amount ? `${fmt(ev.amount)} б.` : 'Баллы';
    return '';
  }
  function subLabel(ev) {
    if (ev.type === 'coin') return 'renah0cki coin';
    if (ev.type === 'da') return 'DonationAlerts';
    if (ev.type === 'tw_points') return ev.title || 'Баллы Twitch';
    if (ev.type === 'tw_sub' || ev.type === 'tw_gift') return ev.title || 'Twitch';
    return 'Twitch';
  }
  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch { return ''; }
  }

  function applyTheme() {
    const r = document.documentElement.style;
    const root = document.getElementById('root');
    const acc = /^#[0-9a-f]{6}$/i.test(cfg.accent || '') ? cfg.accent : '#8b5cf6';
    root.classList.toggle('paused', !!cfg.paused);
    root.dataset.theme = cfg.theme || 'glass';
    root.dataset.mode = cfg.mode || 'list';
    r.setProperty('--w-accent', acc);
    r.setProperty('--w-accent-bg', hexToRgba(acc, 0.18));
    r.setProperty('--w-accent-bd', hexToRgba(acc, 0.42));
    r.setProperty('--w-text', /^#[0-9a-f]{6}$/i.test(cfg.text_color || '') ? cfg.text_color : '#f3f4fa');
    r.setProperty('--w-bg', hexToRgba(cfg.bg_color || '#0d0d17', Math.max(0, Math.min(100, Number(cfg.bg_alpha ?? 82))) / 100));
    r.setProperty('--w-font', FONTS[cfg.font] || FONTS.Inter);
    r.setProperty('--w-fs', Math.max(11, Math.min(26, Number(cfg.font_size) || 14)) + 'px');
  }

  function render(flashId = null) {
    applyTheme();
    const limit = cfg.mode === 'single' ? 1 : Math.max(1, Math.min(20, Number(cfg.limit) || 6));
    const list = events.filter(passes).slice(0, limit);
    const box = document.getElementById('list');
    box.innerHTML = list.map(ev => {
      const showIco = cfg.show_icon !== false;
      const msg = cfg.show_message !== false && ev.message ? `<div class="msg">${esc(ev.message)}</div>` : '';
      const time = cfg.show_time !== false ? `<span>${esc(fmtTime(ev.at))}</span>` : '';
      return `<article class="ev${showIco ? '' : ' no-ico'}${flashId === ev.id ? ' flash' : ''}" data-t="${esc(ev.type)}" data-id="${esc(ev.id)}">
        ${showIco ? `<div class="ico">${iconHtml(ev)}</div>` : ''}
        <div class="body">
          <div class="top"><span class="who">${esc(ev.user)}</span><span class="amt">${esc(rightLabel(ev))}</span></div>
          <div class="sub"><span>${esc(subLabel(ev))}</span>${time}</div>
          ${msg}
        </div>
      </article>`;
    }).join('');
  }

  // быстрая первичная загрузка + живой поток SSE
  fetch(API + '/auc/feed/state').then(r => r.json()).then(d => {
    if (Array.isArray(d.events) && !events.length) events = d.events;
    if (d.cfg) cfg = { ...cfg, ...d.cfg };
    render();
  }).catch(() => {});

  const es = new EventSource(API + '/auc/feed/events');
  es.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (Array.isArray(d.events)) events = d.events;
      if (d.cfg) cfg = { ...cfg, ...d.cfg };
      render();
    } catch {}
  };
  es.addEventListener('feed_item', e => {
    try {
      const ev = JSON.parse(e.data);
      if (!events.some(x => x.id === ev.id)) { events.unshift(ev); if (events.length > 100) events.length = 100; }
      render(ev.id);
    } catch {}
  });
  es.addEventListener('feed_cfg', e => { try { cfg = { ...cfg, ...JSON.parse(e.data) }; render(); } catch {} });
  es.addEventListener('feed_sync', e => { try { const d = JSON.parse(e.data); if (Array.isArray(d.events)) events = d.events; render(); } catch {} });
  es.addEventListener('feed_replay', e => { try { const d = JSON.parse(e.data); render(d.id); } catch {} });
})();
</script>
</body>
</html>
